name: Build and test

# One pipeline for every change: validate the frozen stack and the zero-demo-data boundary, build the F# engine
# and the WebAssembly site, run the conformance (frozen causa-data v1.0.0 dataset), engine flow and browser
# suites. On main, the exact verified build is deployed to GitHub Pages and the deployed site is accepted
# against the same commit (DCC-008, G9).

on:
  pull_request:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: Stack lock (DEP-CURRENT-008)
        run: python3 -I tools/stack/check_lock.py
      - name: Vendored domain and contract are byte-identical to their pinned sources
        run: python3 -I tools/vendor/vendor.py verify
      - name: Kernel type-check
        run: npm run check

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: Build (warnings are errors)
        run: dotnet build App.slnx -c Release
      - name: Fetch the frozen causa-data v1.0.0 dataset (test-only) and verify its identities
        run: tools/data/fetch-causa-data.sh
      - name: Conformance and engine flow tests
        shell: bash
        run: |
          set -uo pipefail
          output=$(dotnet test App.slnx -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory test-results/dotnet 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "$output" | grep -qE 'Passed:[[:space:]]*[1-9]' || { echo "::error::No test passed."; exit 1; }
          if echo "$output" | grep -qE 'Skipped:[[:space:]]*[1-9]'; then echo "::error::Tests were skipped."; exit 1; fi
      - name: Build the production site for this exact commit
        run: node scripts/build-site.mjs
        env:
          CAUSA_BUILD_COMMIT: ${{ github.sha }}
      - name: Zero demonstration data in source and production assets (EXT-DATA-001)
        run: node scripts/check-no-demo-data.mjs
      - name: Install Chromium for Playwright
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance (startup, a11y, responsive, color, MOCKED UI states)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [validate, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deployed-acceptance:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: The served build is exactly this commit
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            served=$(curl -fsS "${PAGE_URL%/}/build-info.json?nocache=$attempt" | python3 -c 'import json,sys;print(json.load(sys.stdin)["sourceCommit"])' || true)
            echo "attempt $attempt: served $served"
            if [ "$served" = "$GITHUB_SHA" ]; then echo "DEPLOYED_SHA=$served" >> "$GITHUB_ENV"; exit 0; fi
            sleep 10
          done
          echo "::error::Pages serves ${served:-nothing}, expected $GITHUB_SHA"; exit 1
      - name: Install Chromium for Playwright
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance against the deployed site
        run: npx playwright test
        env:
          CAUSA_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-acceptance-${{ github.sha }}
          path: test-results/
